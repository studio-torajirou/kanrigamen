<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="120">
  <meta name="robots" content="noindex, nofollow">
  <title>管理画面は更新作業中です</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
           background: #f7f5f0; color: #2f2a24;
           font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; }
    main { width: 100%; max-width: 480px; background: #fff; border-radius: 16px; padding: 32px 24px;
           box-shadow: 0 2px 12px rgba(47, 42, 36, .08); text-align: center; }
    .shop { margin: 0 0 20px; font-size: 14px; letter-spacing: .12em; color: #7a6f62; }
    h1 { margin: 0 0 20px; font-size: 21px; line-height: 1.6; font-weight: 700; }
    p { margin: 0 0 14px; font-size: 16px; line-height: 1.9; }
    .when { font-size: 17px; padding: 12px; background: #f3efe6; border-radius: 10px; }
    .note { font-size: 14px; color: #5c5349; }
    a.btn { display: inline-block; margin: 8px 4px 0; padding: 12px 20px; border-radius: 999px; font-size: 15px; font-weight: 700;
            text-decoration: none; background: #5b7a5a; color: #fff; }
    a.sub { background: #fff; color: #5b7a5a; border: 1px solid #5b7a5a; }
    .auto { margin-top: 24px; font-size: 13px; color: #6f665c; }
  </style>
</head>
<body>
  <main>
    <p class="shop">studio 寅次郎</p>
    <h1>管理画面は、ただいま<br>新しい仕組みへ更新しています</h1>
    <p class="when">本日 <strong>21時30分ごろ</strong> に再開する予定です。</p>
    <p>そのあいだは、この画面を使えません。<br>終わりましたら、ご連絡します。</p>
    <p class="note">予約・お客様・レッスンの枠は、そのまま新しい管理画面へ引き継ぎます。</p>

    <p class="auto">このページは、2分ごとに自動で読み込み直します。</p>
  </main>
</body>
</html>
